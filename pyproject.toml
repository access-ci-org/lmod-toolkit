[build-system]
requires = [ "setuptools >= 80", "setuptools-scm >= 8.3", "ipf >= 1.9" ]
build-backend = "setuptools.build_meta:__legacy__"
# __legacy__ enables access to function in the local package
# see also https://setuptools-git-versioning.readthedocs.io/en/stable/options/version_callback.html

[project]
name = "lmod-toolkit"
requires-python = ">=3.14"
dependencies = [
]
dynamic = [
  "version",
  "readme",
]
description = "ACCESS Lmod Toolkit"
license-files = ["LICEN[CS]E*"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
keywords = [
  "monitoring",
  "information",
  "gathering",
  "publishing",
]
authors = [
  {name = "Andy Loftus", email = "aloftus@illinois.edu"},
  {name = "Eric Blau", email = "blau@globus.org"},
]

[project.urls]
Repository = "https://github.com/access-ci-org/lmod-toolkit"

[tool.setuptools.dynamic]
readme = {file = ["README.pypi"], content-type = "text/markdown"}


# needed because the package name (lmod-toolkit)
# doesn't match the import name (lmod_toolkit)
# [tool.setuptools.packages.find]
# where = ["src"]
# include = ["lmod_toolkit*"]
[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools_scm]
version_file = "src/lmod_toolkit/_version.py"
version_scheme = "ipf.build_helper:mk_version" # a published version must exist in pypi
local_scheme = "no-local-version"  # local version component not allowed on pypi
